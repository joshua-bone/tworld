<title id="panel-synthetic-ms-starting-state-title">Starting State — Synthetic red-key postcondition failure</title>
<desc id="panel-synthetic-ms-starting-state-description">Synthetic observed start at native tick -1: player at (1,1,0), red key present at (2,1,0), red-key inventory 0, two chips remaining. The synthetic contract expects the red key at (2,1,0) to be collected. The bounded synthetic plan intends one east step from (1,1,0) to (2,1,0). The fake runtime exactly observes the player at (1,1,0) before the bounded decision. Exact supplied cell stacks: (0,0,0) terrain:cc1:wall; (1,0,0) terrain:cc1:wall; (2,0,0) terrain:cc1:wall; (3,0,0) terrain:cc1:wall; (4,0,0) terrain:cc1:wall; (0,1,0) terrain:cc1:wall; (1,1,0) terrain:cc1:floor + actor:cc1:chip; (2,1,0) terrain:cc1:floor + pickup:cc1:key-red; (3,1,0) terrain:cc1:floor; (4,1,0) terrain:cc1:wall; (0,2,0) terrain:cc1:wall; (1,2,0) terrain:cc1:wall; (2,2,0) terrain:cc1:wall; (3,2,0) terrain:cc1:wall; (4,2,0) terrain:cc1:wall</desc>
