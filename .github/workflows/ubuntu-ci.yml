name: Ubuntu-CI
on: [push, pull_request]

jobs:
  web-and-ccsolver:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /tworld/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci --include=optional
      - name: Check CCSolver workspace
        run: |
          npm run ccsolver:typecheck
          npm run ccsolver:typecheck:browser
          npm run ccsolver:test
          npm run ccsolver:conformance
          npm run ccsolver:build
          npm run ccsolver:facade
          npm run ccsolver:integration
          npm run ccsolver:corpus:check
          npm run ccsolver:analysis:check
          npm --workspace web run typecheck:tools
          npm run ccsolver:cli -- --help
          npm run ccsolver:dossier -- --help
      - name: Check P1B full-corpus artifacts
        timeout-minutes: 90
        env:
          TWORLD_P1B_ANALYSIS_JOBS: 4
        run: npm run ccsolver:p1b:check
      - name: Check P2A runtime observation artifacts
        timeout-minutes: 10
        run: npm run ccsolver:p2a:check
      - name: Check P3 terminal planning and contextual witness artifacts
        timeout-minutes: 10
        run: npm run ccsolver:p3:check
      - name: Check P4A graphical subgoal evidence artifacts
        timeout-minutes: 2
        run: npm run ccsolver:p4a:check
      - name: Build native replay oracle for P5
        timeout-minutes: 5
        run: |
          sudo apt-get -y update
          sudo apt-get -y install cmake libsdl2-dev
          cmake -S . -B build-verify -DOSHW=sdl -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-verify --target tworld-oracle --parallel 4
      - name: Check P5 certified Key Pyramid artifacts
        timeout-minutes: 15
        run: npm run ccsolver:p5:check
      - name: Check P4B whole-level dossier artifacts
        timeout-minutes: 5
        run: npm run ccsolver:p4b:check
      - name: Check P2B/P6A causal alignment artifacts
        timeout-minutes: 15
        run: npm run ccsolver:p6a:check
      - name: Check browser workspace
        run: |
          npm run typecheck
          npm test -- \
            src/bootstrap/architecture/hexagonalBoundaries.test.ts \
            src/game-core/api/ruleset.test.ts
          npm run build

  build-qt6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QT6
        run: |
          sudo apt-get -y update
          sudo apt-get -y install cmake libsdl2-dev build-essential libgl1-mesa-dev qt6-base-dev
      - name: Build tworld2 (Qt6)
        run: |
          mkdir build-qt6 && cd build-qt6
          cmake -DCMAKE_BUILD_TYPE=Debug -DOSHW=qt \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist-qt6 ..
          make -j4 && make install

  build-qt5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QT5
        run: |
          sudo apt-get -y update
          sudo apt-get -y install cmake libsdl2-dev qtbase5-dev
      - name: Build tworld2 (Qt5)
        run: |
          mkdir build-qt5 && cd build-qt5
          cmake -DCMAKE_BUILD_TYPE=Debug -DOSHW=qt \
            -DCMAKE_PREFIX_PATH=/usr/local/ \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist-qt5 ..
          make -j4 && make install

  build-sdl1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL1
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libsdl1.2-dev cmake
      - name: Build tworld (SDL)
        run: |
          mkdir build-sdl && cd build-sdl
          cmake -DCMAKE_BUILD_TYPE=Debug -DOSHW=sdl \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist-sdl ..
          make -j4 && make install
      - name: Run characterization checks
        run: |
          cd build-sdl
          ctest --output-on-failure
