name: Ubuntu-CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ubuntu-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Select native builds only for native source changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          native=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            native=true
          else
            while IFS= read -r path; do
              case "$path" in
                CMakeLists.txt|cmake/*|legacy_c/*)
                  native=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA" --)
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_PATH: /tworld/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify product workflow boundaries
        run: node --test test/product-workflow-contract.test.mjs
      - name: Install workspace dependencies
        run: npm ci --include=optional
      - name: Typecheck the browser product
        run: npm run typecheck
      - name: Run browser product tests
        run: |
          npm test -- \
            src/player-web/impl/hybridcc-v1 \
            src/player-web/impl/modern \
            src/player-web/impl/browserProfileBackup.test.ts \
            src/player-web/impl/LegacyCanvasScreen.test.ts \
            src/player-web/impl/legacyCanvasMapRenderer.test.ts \
            src/player-web/impl/legacyRenderPresets.test.ts \
            src/player-web/impl/viewportSettings.test.ts \
            src/player-web/impl/specialModesSettings.test.ts \
            src/player-web/impl/specialModesTransform.test.ts \
            src/player-web/impl/monsterMadness.test.ts \
            src/player-web/impl/specialModesRender.test.ts \
            src/player-web/impl/levelProgress.test.ts \
            src/player-web/impl/sessionProgressPolicy.test.ts \
            src/game-core/api/ruleset.test.ts \
            src/ruleset-ms/impl/level.test.ts \
            src/ruleset-ms/impl/tileEffects.test.ts \
            src/ruleset-lynx/impl/tileEffects.test.ts
      - name: Build the browser product
        run: npm run build

  build-qt6:
    needs: classify
    if: ${{ needs.classify.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/joshua-bone/tworld-ci@sha256:a760c0b2f6c02bc39dc59c406554317a35918a1059c5e0b9ea77a67849350cf9
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace for containerized Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build tworld2 (Qt6)
        run: |
          mkdir build-qt6 && cd build-qt6
          cmake -DCMAKE_BUILD_TYPE=Debug -DOSHW=qt \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist-qt6 ..
          make -j4 && make install

  build-qt5:
    needs: classify
    if: ${{ needs.classify.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/joshua-bone/tworld-ci@sha256:a760c0b2f6c02bc39dc59c406554317a35918a1059c5e0b9ea77a67849350cf9
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace for containerized Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build tworld2 (Qt5)
        run: |
          mkdir build-qt5 && cd build-qt5
          cmake -DCMAKE_BUILD_TYPE=Debug -DOSHW=qt \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE \
            -DCMAKE_PREFIX_PATH=/usr/local/ \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist-qt5 ..
          make -j4 && make install

  build-sdl1:
    needs: classify
    if: ${{ needs.classify.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/joshua-bone/tworld-ci@sha256:a760c0b2f6c02bc39dc59c406554317a35918a1059c5e0b9ea77a67849350cf9
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace for containerized Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build tworld (SDL)
        run: |
          mkdir build-sdl && cd build-sdl
          cmake -DCMAKE_BUILD_TYPE=Debug -DOSHW=sdl \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist-sdl ..
          make -j4 && make install
      - name: Run characterization checks
        run: |
          cd build-sdl
          ctest --output-on-failure

  product:
    name: product
    if: ${{ always() }}
    needs:
      - classify
      - web
      - build-qt5
      - build-qt6
      - build-sdl1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected product gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          WEB_RESULT: ${{ needs.web.result }}
          NATIVE_SELECTED: ${{ needs.classify.outputs.native }}
          QT5_RESULT: ${{ needs.build-qt5.result }}
          QT6_RESULT: ${{ needs.build-qt6.result }}
          SDL1_RESULT: ${{ needs.build-sdl1.result }}
        run: |
          [[ "$CLASSIFY_RESULT" == "success" ]]
          [[ "$WEB_RESULT" == "success" ]]
          if [[ "$NATIVE_SELECTED" == "true" ]]; then
            [[ "$QT5_RESULT" == "success" ]]
            [[ "$QT6_RESULT" == "success" ]]
            [[ "$SDL1_RESULT" == "success" ]]
          else
            [[ "$NATIVE_SELECTED" == "false" ]]
            [[ "$QT5_RESULT" == "skipped" ]]
            [[ "$QT6_RESULT" == "skipped" ]]
            [[ "$SDL1_RESULT" == "skipped" ]]
          fi
