name: GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_PATH: /tworld/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install workspace dependencies
        run: npm ci --include=optional
      - name: Build CCSolver once
        run: npm run ccsolver:build
      - name: Bundle the checked P7 presentation verifier
        env:
          P7_TRAINING_RUNNER_OUT_DIR: ${{ runner.temp }}/p7-training-runners
        run: |
          mkdir -p "$P7_TRAINING_RUNNER_OUT_DIR"
          npm run ccsolver:p7-training:bundle:presentation
      - name: Build web app for GitHub Pages
        run: npm run build
      - name: Attest the fresh P7 player graph and all checked packs
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          PRESENTATION_RUNNER="$RUNNER_TEMP/p7-training-runners/p7-training-presentation-runner.mjs"
          PRESENTATION_ARTIFACTS="$RUNNER_TEMP/p7-training-presentation-artifacts"
          mkdir -p "$PRESENTATION_ARTIFACTS"
          PRESENTATION_COMMON=(
            --root .
            --head "$ACTUAL_HEAD"
            --presentation-artifacts "$PRESENTATION_ARTIFACTS"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          node "$PRESENTATION_RUNNER" prepare "${PRESENTATION_COMMON[@]}"
          node "$PRESENTATION_RUNNER" graph-check "${PRESENTATION_COMMON[@]}"
          node "$PRESENTATION_RUNNER" graph-attest "${PRESENTATION_COMMON[@]}"
          node "$PRESENTATION_RUNNER" attest "${PRESENTATION_COMMON[@]}" \
            --packs cclp1,cclp4,cclp5
      - name: Emit attested P7 training replay packs
        run: |
          npm run ccsolver:p7-training:emit-dist:prepared
          for PACK_ID in cclp1 cclp4 cclp5; do
            LEAF_ROOT="web/dist/dev/ccsolver/training-replays/$PACK_ID"
            [[ -d "$LEAF_ROOT" ]]
            [[ -d "$LEAF_ROOT/levels" ]]
            for ROOT_FILE in \
              browser.json \
              execution-index.json \
              index.html \
              manifest.json \
              pack-summary.json \
              proof-index.json; do
              [[ -f "$LEAF_ROOT/$ROOT_FILE" ]]
            done
          done
      - name: Add SPA fallback page
        run: cp web/dist/index.html web/dist/404.html
      - name: Emit unlisted CCSolver dossier bundle
        run: npm run ccsolver:p4b:emit-dist:prepared
      - name: Emit unlisted causal alignment bundle
        run: npm run ccsolver:p6a:emit-dist:prepared
      - name: Emit unlisted standard-tactic realization bundle
        run: npm run ccsolver:p7a:emit-dist:prepared
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
